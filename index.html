<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>여행 플래너 v7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Caveat:wght@500&display=swap">
<style>
/* 에키 스탬프 다이어리 — 역 스탬프 수첩 + 여행 엽서, 단일 열 모바일 레이아웃 */
:root{
--paper:#F4EFE6;--sheet:#FBF7F0;--ink:#2B211C;--ink-2:#6B5B4F;
--rule:#E3D8C7;--rule-2:#CDBFAA;
--ai:#5E6E50;--ai-ink:#4E5C42;--ai-soft:#E7EADF;--on-ai:#FBF7F0;
--kin:#D8BC74;--kin-soft:#F3E7C6;--kin-ink:#6B4F1D;
--ver:#B8401F;--on-ver:#FBF7F0;
--sage:#A9B59A;--butter:#EED9A0;--choc:#2B211C;
--warn-soft:#F4DED4;--warn-ink:#8E3216;
--note:#F6EBC8;--note-line:#E6D7A6;--tape:#A9B59A;
--case:#E9D9BC;--case-rib:#DECCA9;--case-edge:#8C6E44;
--red:#B8401F;--dot:rgba(43,33,28,.06);--mtn:#EAE1D1;
--shadow:0 16px 30px rgba(120,95,70,.18);--shadow-s:0 6px 16px rgba(120,95,70,.12);
--fixed-ink:#2B211C;
--f:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
--fd:"Hahmlet","IBM Plex Sans KR",serif;
--fc:"Caveat",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#1D1713;--sheet:#272019;--ink:#F1E7DA;--ink-2:#C2B09E;--rule:#3B3028;--rule-2:#54453A;
--ai:#B9C6A8;--ai-ink:#CAD5BB;--ai-soft:#2F3529;--on-ai:#1D1713;
--kin:#D9C07E;--kin-soft:#3A3121;--kin-ink:#EED9A0;
--ver:#DE7454;--on-ver:#1D1713;--sage:#7F8C70;--butter:#BFA86C;--choc:#F1E7DA;
--warn-soft:#3B241A;--warn-ink:#F0B193;--note:#332B1D;--note-line:#43392A;--tape:#5E6B52;
--case:#3A3024;--case-rib:#43382B;--case-edge:#BFA270;--red:#E27B5C;--dot:rgba(241,231,218,.05);--mtn:#2A231C;
--shadow:0 16px 30px rgba(0,0,0,.35);--shadow-s:0 6px 16px rgba(0,0,0,.3);
color-scheme:dark}}
:root[data-theme="dark"]{
--paper:#1D1713;--sheet:#272019;--ink:#F1E7DA;--ink-2:#C2B09E;--rule:#3B3028;--rule-2:#54453A;
--ai:#B9C6A8;--ai-ink:#CAD5BB;--ai-soft:#2F3529;--on-ai:#1D1713;
--kin:#D9C07E;--kin-soft:#3A3121;--kin-ink:#EED9A0;
--ver:#DE7454;--on-ver:#1D1713;--sage:#7F8C70;--butter:#BFA86C;--choc:#F1E7DA;
--warn-soft:#3B241A;--warn-ink:#F0B193;--note:#332B1D;--note-line:#43392A;--tape:#5E6B52;
--case:#3A3024;--case-rib:#43382B;--case-edge:#BFA270;--red:#E27B5C;--dot:rgba(241,231,218,.05);--mtn:#2A231C;
--shadow:0 16px 30px rgba(0,0,0,.35);--shadow-s:0 6px 16px rgba(0,0,0,.3);
color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:5px 5px;color:var(--ink);font:400 15px/1.55 var(--f);margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ver);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));padding-top:18px}
.lbl{font:500 12px/1.4 var(--f);letter-spacing:.08em;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.fd{font-family:var(--fd);letter-spacing:-.02em}
.pill{min-height:44px;padding:0 18px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;font:600 14px var(--f);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.screen{animation:none}
.screen.enter{animation:slideIn .3s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.panel.slide{animation:slideIn .24s ease-out}
/* ── Screen 1 ── */
.s1head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.card-post{background:var(--sheet);border-radius:6px;padding:22px 18px 18px;box-shadow:var(--shadow);transform:rotate(-1.2deg);position:relative;margin-top:10px}
.tape{position:absolute;top:-13px;left:50%;width:100px;height:26px;margin-left:-50px;transform:rotate(-4deg);background:repeating-linear-gradient(135deg,var(--sage) 0 7px,transparent 7px 11px),var(--sage);opacity:.85}
.tape{background:repeating-linear-gradient(135deg,var(--sage) 0 8px,var(--ai-soft) 8px 12px)}
.hand{font:500 30px/1 var(--fc);color:var(--ver);transform:rotate(-3deg);display:inline-block}
.s1head h1{font:800 30px/1.15 var(--fd);letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
.s1head p{margin:0;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 20px;position:relative}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:21px;border-top:2px dotted var(--rule-2)}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.st b{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);display:grid;place-items:center;font:800 15px var(--fd);box-shadow:0 4px 0 var(--rule-2)}
.st.cur b{background:var(--ver);color:var(--on-ver);border-color:var(--ver);transform:rotate(-6deg)}
.st.done b{background:var(--sage);color:var(--fixed-ink)}
.st span{font-size:12px;color:var(--ink-2)}
.st.cur span{color:var(--ink);font-weight:600}
.fbox{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow-s)}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld>label,.fld>.flab{font:600 14px var(--f)}
.fld small{color:var(--ink-2);font-size:12.5px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--rule-2);background:var(--paper);padding:10px 14px;font-size:16px}
.inp:focus{border-color:var(--ver);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--rule-2);background:var(--sheet);font:500 14px var(--f)}
.chip[aria-pressed="true"]{background:var(--choc);color:var(--paper);border-color:var(--choc)}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--rule-2);border-radius:12px;background:var(--paper);width:max-content}
.stepper button{width:48px;height:48px;font:600 20px var(--f)}
.stepper output{min-width:56px;text-align:center;font:800 20px var(--fd)}
.err{color:var(--warn-ink);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.bbar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -8px 20px rgba(120,95,70,.10);padding:12px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));z-index:20}
.bbar .in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bbar .sp{flex:1}
.btn-main{min-height:52px;padding:0 26px;border-radius:999px;background:var(--ver);color:var(--on-ver);font:600 16px var(--f)}
.btn-ghost{min-height:44px;padding:0 14px;border-radius:999px;color:var(--ink-2);font:500 14px var(--f)}
/* ── Screen 2 top ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .pill{min-height:40px;padding:0 14px;font-size:13px;flex:none}
/* stamp nav */
.navwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:8px max(20px,env(safe-area-inset-left,0px)) 10px;transition:padding .22s ease-out}
.stamps{display:flex;align-items:flex-start;gap:0;overflow-x:auto;scrollbar-width:none;padding:6px 2px 4px}
.stamps::-webkit-scrollbar{display:none}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;position:relative}
.link{flex:none;width:14px;border-top:2px dotted var(--rule-2);margin-top:30px}
.stamp{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);box-shadow:0 4px 0 var(--rule-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:width .22s ease-out,height .22s ease-out,transform .22s ease-out}
.stamp b{font:800 13px var(--fd)}
.stamp i{font-style:normal;font-size:10px;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stamp[aria-current="true"]{background:var(--ver);color:var(--on-ver);border-color:var(--ver);transform:rotate(-6deg)}
.sdate{font-size:11px;color:var(--ink-2)}
.today{position:absolute;top:-4px;right:-8px;background:var(--choc);color:var(--paper);font:600 10px var(--f);padding:1px 6px;border-radius:999px}
.navwrap.stuck{padding-top:4px;padding-bottom:4px;box-shadow:0 1px 0 var(--rule)}
.navwrap.stuck .stamp{width:44px;height:44px}
.navwrap.stuck .stamp i,.navwrap.stuck .sdate{display:none}
.navwrap.stuck .link{margin-top:22px}
.panel{display:flex;flex-direction:column;gap:16px;margin-top:8px}
/* confirm card */
.confirm{border:1.5px dashed var(--rule-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--sheet)}
.confirm .hd{display:flex;gap:12px;align-items:flex-start}
.confirm h3{margin:0;font:700 17px var(--fd);letter-spacing:-.02em}
.confirm p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.preview{width:100%;max-height:132px;min-height:96px;overflow:auto;border-radius:12px;border:1px solid var(--rule);background:var(--paper);padding:10px 12px;font:400 13px/1.55 var(--f);resize:none;white-space:pre-wrap}
.copy{min-height:48px;border-radius:12px;background:var(--choc);color:var(--paper);font:600 15px var(--f);display:flex;align-items:center;justify-content:center;gap:8px}
.draftnote{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--warn-ink);background:var(--warn-soft);border-radius:12px;padding:8px 8px 8px 14px}
.draftnote .pill{min-height:40px;font-size:13px;border-color:var(--warn-ink);color:var(--warn-ink);background:transparent}
.loading{border-radius:16px;background:var(--sheet);border:1px solid var(--rule);padding:22px 18px;display:flex;gap:14px;align-items:center}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--rule-2);border-top-color:var(--ver);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
/* ticket */
.ticket{border-radius:16px;background:var(--sheet);box-shadow:var(--shadow);overflow:hidden}
.thead{padding:16px 20px 20px;color:var(--fixed-ink)}
.thead.odd{background:var(--sage)}.thead.even{background:var(--butter)}
.thead .meta{display:flex;justify-content:space-between;gap:8px;font:600 12px var(--f);letter-spacing:.08em}
.thead h2{font:800 26px/1.2 var(--fd);letter-spacing:-.02em;margin:8px 0 4px;text-wrap:balance}
.thead p{margin:0;font-size:14px}
.thead .cnt{margin-top:10px;font:600 12.5px var(--f)}
.perf{position:relative;height:0;border-top:2px dashed var(--rule-2);margin:0 16px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.perf::before{left:-27px}.perf::after{right:-27px}
.tbody{padding:18px 16px 18px 8px}
.tl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0}
.tcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:0 12px 18px 0}
.time{font:700 15px var(--fd);font-variant-numeric:tabular-nums}
.ccol{position:relative;border-left:1px solid var(--rule);padding:0 0 18px 16px;min-width:0}
.row:last-child .ccol{padding-bottom:4px}
.dot{position:absolute;left:-5px;top:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet)}
.row.k-stay .dot{background:var(--kin);border-color:var(--kin)}
.row.first-today .dot{background:var(--ver);border-color:var(--ver)}
.place{font:600 15.5px/1.4 var(--f)}
.move{font-size:13.5px;color:var(--ai-ink);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badges:empty{display:none}
.tag{font:600 11px var(--f);letter-spacing:.08em;border:1.5px solid transparent;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag-eat{border-color:var(--ver);color:var(--ver)}
.tag-stay{background:var(--butter);border-color:var(--butter);color:var(--fixed-ink)}
.tag-see{background:var(--sage);border-color:var(--sage);color:var(--fixed-ink)}
.tag-move{background:var(--choc);border-color:var(--choc);color:var(--paper)}
.bdg{font:700 11px var(--f);border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.b-pass{background:var(--ai);color:var(--on-ai)}
.b-ic{border:1.5px solid var(--ai);color:var(--ai-ink)}
.b-cash,.b-warn{background:var(--warn-soft);color:var(--warn-ink)}
.b-card{border:1px solid var(--rule-2);color:var(--ink-2)}
.b-free{background:var(--kin-soft);color:var(--kin-ink)}
.b-closed{border:1px dashed var(--ink-2);color:var(--ink-2)}
.more{margin-top:6px}
.more summary{list-style:none;cursor:pointer;font:600 13px var(--f);color:var(--ai-ink);min-height:32px;display:inline-flex;align-items:center;gap:4px}
.more summary::-webkit-details-marker{display:none}
.more summary svg{transition:transform .22s ease-out}
.more[open] summary svg{transform:rotate(90deg)}
.more .in{font-size:13.5px;display:flex;flex-direction:column;gap:6px;padding:8px 0 2px}
.phrase{background:var(--ai-soft);border-radius:12px;padding:8px 12px}
.phrase b{display:block;font-weight:600}
.phrase span{color:var(--ink-2);font-size:12.5px}
.tonight{margin-top:14px;margin-left:8px;border:1.5px dashed var(--rule-2);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.tonight .ic{color:var(--kin-ink);flex:none}
.tonight b{display:block;font-weight:600}
.empty{border:1.5px dashed var(--rule-2);border-radius:16px;padding:22px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font:700 17px var(--fd);margin-bottom:4px}
/* spots */
.dhead{font:800 22px/1.25 var(--fd);letter-spacing:-.02em;margin:0}
.dsub{color:var(--ink-2);margin:-10px 0 0;font-size:14px}
.grp h3{font:500 12px var(--f);letter-spacing:.08em;color:var(--ink-2);margin:0 0 8px}
.slist{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:16px}
.slist li{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.slist li:last-child{border-bottom:0}
.slist .nm{display:flex;gap:8px;align-items:center;justify-content:space-between}
.slist .nm b{font:600 15.5px var(--f);min-width:0}
.slist p{margin:0;font-size:13.5px;color:var(--ink-2)}
/* home */
.post{background:var(--sheet);padding:10px 10px 16px;border-radius:6px;transform:rotate(-1.2deg);box-shadow:var(--shadow);position:relative;margin:14px 4px 6px}
.photo{position:relative;height:clamp(240px,calc(100svh - 470px),420px);border-radius:3px;overflow:hidden;background:var(--mtn);display:block;width:100%}
.photo img{width:100%;height:100%;object-fit:cover;filter:contrast(.94) saturate(.85) sepia(.08);display:block}
.photo .pm{position:absolute;top:12px;right:12px;color:var(--ink-2);opacity:.75}
.photo .pick{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,var(--sheet) 82%,transparent);border:1px solid var(--rule-2);border-radius:999px;padding:8px 14px;font:600 13px var(--f);display:inline-flex;gap:6px;align-items:center;min-height:40px}
.photo .ph-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2)}
.cap{padding:14px 8px 0}
.cap h2{font:800 30px/1.15 var(--fd);letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
.cap .ln{border-top:1.5px dashed var(--rule-2);margin:10px 0;}
.cap .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.dday{background:var(--butter);color:var(--fixed-ink);font:700 13px var(--f);padding:4px 12px;border-radius:999px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:16px;min-height:120px;padding:14px 16px;text-align:left;color:var(--fixed-ink);display:flex;flex-direction:column;gap:6px;transition:box-shadow .22s ease-out}
.tile.todo{background:var(--sage)}.tile.pack{background:var(--butter)}
.tile[aria-expanded="true"]{box-shadow:0 0 0 2px var(--ink)}
.tile .t1{font:600 12px var(--f);letter-spacing:.08em}
.tile .n{font:800 30px/1 var(--fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .n small{font-size:16px;font-weight:700}
.bar{height:6px;border-radius:999px;background:rgba(43,33,28,.18);overflow:hidden}
.bar i{display:block;height:100%;background:#2B211C;border-radius:999px}
.tile .sm{font-size:12px}
/* memo */
.memo{background:var(--note) repeating-linear-gradient(to bottom,transparent 0 27px,var(--note-line) 27px 28px);background-color:var(--note);padding:26px 18px 16px;transform:rotate(-.35deg);position:relative;border-radius:3px;box-shadow:var(--shadow-s)}
.memo .mt{position:absolute;top:-10px;left:50%;width:74px;height:20px;margin-left:-37px;background:var(--tape);opacity:.9}
.memo h3{font:700 17px var(--fd);margin:0 0 8px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;align-items:center;gap:10px;min-height:44px}
.cb{width:44px;height:44px;margin:0 -11px;display:grid;place-items:center;flex:none}
.cb span{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink-2);display:grid;place-items:center;background:var(--sheet)}
.memo .cb[aria-checked="true"] span{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.cb svg{opacity:0}
.cb[aria-checked="true"] svg{opacity:1}
.cb.pop span{animation:pop .18s ease-out}
@keyframes pop{50%{transform:scale(1.4) rotate(-10deg)}}
.chk .tx{flex:1;min-width:0;font-size:15px}
.memo li.done .tx{color:var(--ink-2);text-decoration:line-through}
.del{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2);flex:none;margin-right:-10px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .inp{min-height:44px;flex:1;min-width:0;background:var(--sheet)}
.addrow button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--choc);color:var(--paper);font:600 14px var(--f)}
/* suitcase */
.case-wrap{display:flex;flex-direction:column;align-items:center;padding-top:4px}

if(!sample){st0.draft={status:'none'};fin();return}
const dl=days.map((d,i)=>`D${i+1} ${iso(d)} (${WDK[d.getDay()]})`).join(', ');
const head=dom?'국내 자차 여행 일정 초안을 JSON으로만 답하세요. 설명 문장 없이 JSON 객체 하나만.':'해외 자유여행 일정 초안을 JSON으로만 답하세요. 설명 문장 없이 JSON 객체 하나만.';
const payRule=dom?'하이패스|현금|카드|무료':'패스|티켓|교통카드|현금|카드|무료';
const extra=dom?'- 자차 이동 기준: move는 "자차 약 N분(약 Nkm)" 형식, 통행료·주차·휴게소 정차를 행으로 넣고, phrase와 pron은 빈 문자열. 첫날은 출발 운전, 마지막 날은 귀가 운전 포함. 운전 시간은 하루 4시간을 넘기지 않게.':'- 첫날은 도착, 마지막 날은 귀국 이동 포함. 현지어 문장은 택시·식당·숙소용으로 필요한 행만.';
const prompt=`${head}
여행 정보:
${sum}
일차: ${dl}
규칙:
- days 배열 길이는 정확히 ${days.length}. 하루 4~7행, 이동·줄 서기 시간을 넉넉히.
- 각 day: {"abbr":"대표 지명 2~4글자","title":"그날 제목(짧게)","sub":"한 줄 요약","rows":[...]}
- 각 row: {"k":"eat|stay|see|move","t":"HH:MM","place":"장소","move":"이동 수단·소요","pay":"${payRule}","note":"메모 한 줄","phrase":"현지어 문장","pron":"한국어 발음","alt":"놓치면 대안","unverified":true}
- 모든 row의 unverified는 true.
${extra}
- spots 배열: 일차마다 맛집(kind "eat") 1~2곳, 볼 곳(kind "see") 1~2곳. {"day":1,"name":"","kind":"eat|see","reserve":"예약 가능|예약 불가|불필요","cashOnly":false,"closed":"휴무일 또는 빈 문자열","note":"한 줄","unverified":true}
- 최상위: {"cityEn":"${dom?'목적지 지명(한글)':'도시 영문명'}","currency":"${dom?'KRW':'ISO 통화 코드'}","days":[...],"spots":[...]}
- 피하고 싶은 것은 반드시 피하세요. 모든 텍스트는 한국어(해외 현지어 문장 제외).`;
try{
const j=await sample.json(prompt,force?{cache:false}:{});
if(!j||!Array.isArray(j.days))throw{code:'invalid_json'};
const clean=x=>typeof x==='string'?x.slice(0,300):x==null?'':String(x).slice(0,300);
const ds=j.days.slice(0,days.length).map(d=>({abbr:clean(d&&d.abbr).slice(0,8),title:clean(d&&d.title),sub:clean(d&&d.sub),
rows:(Array.isArray(d&&d.rows)?d.rows:[]).slice(0,9).map(r=>({k:['eat','stay','see','move'].includes(r&&r.k)?r.k:'see',t:clean(r&&r.t).slice(0,5),place:clean(r&&r.place),move:clean(r&&r.move),pay:clean(r&&r.pay),note:clean(r&&r.note),phrase:clean(r&&r.phrase),pron:clean(r&&r.pron),alt:clean(r&&r.alt),unverified:true}))}));
const sp=(Array.isArray(j.spots)?j.spots:[]).slice(0,60).map(x=>({day:+(x&&x.day)||0,name:clean(x&&x.name),kind:x&&x.kind==='eat'?'eat':'see',reserve:clean(x&&x.reserve),cashOnly:!!(x&&x.cashOnly),closed:clean(x&&x.closed),note:clean(x&&x.note),unverified:true}));
st0.draft={status:'draft',days:ds,spots:sp,cityEn:clean(j.cityEn).slice(0,30)||undefined,currency:/^[A-Z]{3}$/.test(j.currency||'')?j.currency:undefined};
}catch(e){
const code=e&&e.code;
st0.draft={status:(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed')?'none':'failed'};
if(code==='rate_limited')toast('잠시 뒤에 다시 시도해 주세요');
}
fin();
}
/* ---------- 복사 ---------- */
function copySummary(){
const txt=summary(),ta=document.getElementById('sumText');
const fallback=()=>{if(ta){ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}}toast('길게 눌러 복사하세요')};
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('복사했어요. 채팅에 붙여넣어 주세요'),fallback)}else fallback()}catch(e){fallback()}
}
/* ---------- 사진 ---------- */
document.getElementById('photoIn').addEventListener('change',e=>{
const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
const url=URL.createObjectURL(file),img=new Image();
img.onload=()=>{const M=1000,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
let d;try{d=c.toDataURL('image/jpeg',.82)}catch(er){toast('이 사진은 쓸 수 없어요');return}
photoMem=d;if(!store.set(pkey(),d))toast('사진을 저장하지 못했어요. 지금 화면에서만 보여요');render()};
img.onerror=()=>{URL.revokeObjectURL(url);toast('사진을 열지 못했어요. 다른 사진을 골라 주세요')};
img.src=url;
});
/* ---------- 토스트·스크롤 ---------- */
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1800)}
function onScroll(){const nav=document.getElementById('nav');if(!nav)return;
const top=parseFloat(getComputedStyle(nav).top)||0;nav.classList.toggle('stuck',window.scrollY>40&&nav.getBoundingClientRect().top<=top+1)}
window.addEventListener('scroll',onScroll,{passive:true});
startup();
if(SYNC_URL){syncNow();setInterval(()=>{if(!document.hidden)syncNow()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()})}
(function(){const s=document.getElementById('stamps'),c=s&&s.querySelector('[aria-current="true"]');if(c)c.scrollIntoView({inline:'center',block:'nearest'})})();
</script>
